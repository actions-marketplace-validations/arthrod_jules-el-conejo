name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Unit tests (vitest)
        run: bun run test
      - name: Biome
        run: bun run lint
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: actionlint (workflows and examples)
        # actionlint 1.7.12 predates GitHub's self-repository syntax (uses: $/, July 2026),
        # so that one message is ignored.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color -ignore 'specifying action "\$/" in invalid format' \
            .github/workflows/ci.yml examples/autonomous-bug-fixer.yml examples/session-cleanup-on-merge.yml

  test-bash-3:
    name: Unit tests under macOS bash 3.2
    # macOS ships bash 3.2 as /bin/bash; keep scripts/jules.sh compatible with it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Unit tests under /bin/bash
        run: /bin/bash --version && bun run test
        env:
          JULES_TEST_BASH: /bin/bash

  e2e:
    name: End-to-end (uses the action against a mock Jules API)
    # Runs the composite action itself against a local mock Jules API. `uses: $/`
    # (self-repository syntax) loads the action from this commit, independent of
    # whatever the workspace holds.
    runs-on: ubuntu-latest
    env:
      JULES_API_BASE_URL: http://127.0.0.1:8787/v1alpha
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Start mock Jules API
        run: |
          bun test/fixtures/mock-jules-server.ts 8787 > "$RUNNER_TEMP/mock-jules.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8787/healthz && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/mock-jules.log"
          exit 1

      - name: An invalid mode fails the action before any API call
        id: bad_mode
        continue-on-error: true
        uses: $/
        with:
          mode: remove
          jules_api_key: e2e-test-key

      # The action must reuse this checkout instead of cleaning it.
      - name: Leave an untracked file in the workspace
        run: echo "caller file" > untracked-sentinel.txt

      - name: Create a session through the action
        id: create
        uses: $/
        with:
          # Mixed case on purpose: validate normalizes it for the later steps.
          mode: Create
          prompt: Fix the e2e bug
          title: E2E session
          jules_api_key: e2e-test-key
          starting_branch: main
          include_last_commit: true

      - name: Delete the session through the action
        id: delete
        uses: $/
        with:
          mode: delete
          session_id: ${{ steps.create.outputs.session_id }}
          jules_api_key: e2e-test-key

      - name: Assert outputs and recorded API calls
        env:
          SESSION_ID: ${{ steps.create.outputs.session_id }}
          SESSION_NAME: ${{ steps.create.outputs.session_name }}
          SESSION_URL: ${{ steps.create.outputs.session_url }}
          RESPONSE: ${{ steps.create.outputs.response }}
          DELETED_ID: ${{ steps.delete.outputs.session_id }}
          DELETED_NAME: ${{ steps.delete.outputs.session_name }}
          BAD_MODE_OUTCOME: ${{ steps.bad_mode.outcome }}
        run: |
          set -x
          test "$BAD_MODE_OUTCOME" = "failure"
          test -f untracked-sentinel.txt
          test ! -e .jules-el-conejo-checkout
          test "$SESSION_ID" = "16871897978654894041"
          test "$SESSION_NAME" = "sessions/16871897978654894041"
          test "$SESSION_URL" = "https://jules.google.com/session/16871897978654894041"
          test "$DELETED_ID" = "16871897978654894041"
          test "$DELETED_NAME" = "sessions/16871897978654894041"
          echo "$RESPONSE" | jq -e '.name == "sessions/16871897978654894041"'
          curl -fsS http://127.0.0.1:8787/__requests | tee "$RUNNER_TEMP/requests.json"
          jq -e '
            length == 2
            and .[0].method == "POST" and .[0].path == "/v1alpha/sessions"
            and .[0].headers["x-goog-api-key"] == "e2e-test-key"
            and (.[0].body | fromjson | .title == "E2E session"
              and (.prompt | startswith("Fix the e2e bug\n\n\nContent of the latest commit"))
              and .sourceContext.source == "sources/github/\(env.GITHUB_REPOSITORY)")
            and .[1].method == "DELETE"
            and .[1].path == "/v1alpha/sessions/16871897978654894041"
          ' "$RUNNER_TEMP/requests.json"

  e2e-no-workspace-repo:
    name: End-to-end (caller checked out into a subdirectory)
    # The workspace root is not a repo, so include_last_commit makes the action
    # check out into its own subdirectory. actions/checkout would delete the
    # contents of a non-repo target, so src/ surviving proves it never aimed at
    # the workspace root.
    runs-on: ubuntu-latest
    env:
      JULES_API_BASE_URL: http://127.0.0.1:8787/v1alpha
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: src
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Start mock Jules API
        run: |
          bun src/test/fixtures/mock-jules-server.ts 8787 > "$RUNNER_TEMP/mock-jules.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8787/healthz && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/mock-jules.log"
          exit 1

      - name: Create a session that includes the last commit
        uses: $/
        with:
          mode: create
          prompt: Fix the e2e bug
          jules_api_key: e2e-test-key
          starting_branch: main
          include_last_commit: true

      - name: Assert the workspace is intact and the prompt has git context
        run: |
          set -x
          test -f src/action.yaml
          test -d src/.git
          test ! -e .jules-el-conejo-checkout
          curl -fsS http://127.0.0.1:8787/__requests | tee "$RUNNER_TEMP/requests.json"
          jq -e '
            length == 1
            and .[0].method == "POST" and .[0].path == "/v1alpha/sessions"
            and (.[0].body | fromjson | .prompt
              | startswith("Fix the e2e bug\n\n\nContent of the latest commit")
                and contains("\ncommit \(env.GITHUB_SHA)"))
          ' "$RUNNER_TEMP/requests.json"
