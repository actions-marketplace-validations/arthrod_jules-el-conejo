name: Jules Invoke
description: 'Invoke Jules, an AI-powered coding agent, to perform tasks on your codebase.'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  prompt:
    description: 'The prompt to pass to Jules (required for create mode)'
    required: false
    default: ''
  title:
    description: 'Optional title for the Jules session (auto-generated if omitted)'
    required: false
    default: ''
  include_last_commit:
    description: 'Whether to pass content of the last commit'
    default: false
  include_commit_log:
    description: 'Whether to pass commit history'
    default: false
  starting_branch:
    description: 'The branch for Jules to start from'
    required: false
    default: 'main'
  require_plan_approval:
    description: 'Whether Jules should wait for plan approval before executing. Set to false for fully autonomous operation.'
    default: false
  automation_mode:
    description: 'Automation mode for the session. AUTO_CREATE_PR makes Jules create a PR automatically.'
    required: false
    default: 'AUTO_CREATE_PR'
  jules_api_key:
    description: 'The Jules API key to use for authentication'
    required: true
  mode:
    description: 'Action mode: create (default) to start a new session, delete to remove an existing session'
    required: false
    default: 'create'
  session_id:
    description: 'Session ID for delete mode (e.g., sessions/ses_abc123 or just ses_abc123)'
    required: false
    default: ''

outputs:
  session_id:
    description: 'The Jules session ID (e.g., ses_abc123)'
    value: ${{ steps.invoke.outputs.session_id }}
  session_name:
    description: 'The full session resource name (e.g., sessions/ses_abc123)'
    value: ${{ steps.invoke.outputs.session_name }}
  response:
    description: 'The full JSON response from the Jules API'
    value: ${{ steps.invoke.outputs.response }}

runs:
  using: "composite"
  steps:
    # All values reach scripts/jules.sh through env; no ${{ }} inside run blocks.
    - name: Validate inputs
      shell: bash
      env:
        JULES_MODE: ${{ inputs.mode }}
        JULES_PROMPT: ${{ inputs.prompt }}
        JULES_SESSION_ID: ${{ inputs.session_id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" validate

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      if: ${{ inputs.mode == 'create' }}
      with:
        fetch-depth: 30
        persist-credentials: false

    - name: Create Jules session
      id: invoke
      if: ${{ inputs.mode == 'create' }}
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        JULES_PROMPT: ${{ inputs.prompt }}
        JULES_TITLE: ${{ inputs.title }}
        JULES_STARTING_BRANCH: ${{ inputs.starting_branch }}
        JULES_REPOSITORY: ${{ github.repository }}
        JULES_REQUIRE_PLAN_APPROVAL: ${{ inputs.require_plan_approval }}
        JULES_AUTOMATION_MODE: ${{ inputs.automation_mode }}
        JULES_INCLUDE_LAST_COMMIT: ${{ inputs.include_last_commit }}
        JULES_INCLUDE_COMMIT_LOG: ${{ inputs.include_commit_log }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" create

    - name: Delete Jules session
      id: delete
      if: ${{ inputs.mode == 'delete' }}
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        JULES_SESSION_ID: ${{ inputs.session_id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" delete
