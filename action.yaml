name: Jules, el conejo
description: '🐇🥕 Jules, el conejo, hands tasks on your codebase to Jules, the AI coding agent from Google Labs.'

branding:
  icon: 'code'
  color: 'orange'

inputs:
  prompt:
    description: '🥕 The prompt to pass to Jules (required for create mode)'
    required: false
    default: ''
  title:
    description: '🐇 Optional title for the Jules session (auto-generated if omitted)'
    required: false
    default: ''
  include_last_commit:
    description: '🥕 Whether to pass content of the last commit (true/false)'
    default: false
  include_commit_log:
    description: '🥕 Whether to pass commit history (true/false)'
    default: false
  starting_branch:
    description: '🐇 The branch for Jules to start from'
    required: false
    default: 'main'
  require_plan_approval:
    description: '🐇 true makes Jules wait for plan approval; false (default) runs fully autonomously. Only true/false (any case) are accepted.'
    default: false
  automation_mode:
    description: '🥕 Jules AutomationMode: AUTO_CREATE_PR (default) opens a PR automatically; AUTOMATION_MODE_UNSPECIFIED creates no PR.'
    required: false
    default: 'AUTO_CREATE_PR'
  jules_api_key:
    description: '🐇🔑 The Jules API key to use for authentication (pass it from secrets)'
    required: true
  mode:
    description: '🥕 create (default) starts a new session; delete removes an existing one. Case-insensitive; any other value is an error.'
    required: false
    default: 'create'
  session_id:
    description: '🐇 Session to delete in delete mode, e.g. 16871897978654894041 or sessions/16871897978654894041'
    required: false
    default: ''

outputs:
  session_id:
    description: '🥕 The Jules session ID, e.g. 16871897978654894041 (create and delete modes)'
    value: ${{ steps.invoke.outputs.session_id || steps.delete.outputs.session_id }}
  session_name:
    description: '🥕 The full session resource name, e.g. sessions/16871897978654894041 (create and delete modes)'
    value: ${{ steps.invoke.outputs.session_name || steps.delete.outputs.session_name }}
  session_url:
    description: '🐇 Link to the session in the Jules web app (create mode)'
    value: ${{ steps.invoke.outputs.session_url }}
  response:
    description: '🥕 The full JSON response from the Jules API (create mode)'
    value: ${{ steps.invoke.outputs.response }}

runs:
  using: "composite"
  steps:
    # All values reach scripts/jules.sh through env; no ${{ }} inside run blocks.
    # Later steps use the normalized values that validate writes as outputs.
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        JULES_MODE: ${{ inputs.mode }}
        JULES_PROMPT: ${{ inputs.prompt }}
        JULES_SESSION_ID: ${{ inputs.session_id }}
        JULES_REQUIRE_PLAN_APPROVAL: ${{ inputs.require_plan_approval }}
        JULES_AUTOMATION_MODE: ${{ inputs.automation_mode }}
        JULES_INCLUDE_LAST_COMMIT: ${{ inputs.include_last_commit }}
        JULES_INCLUDE_COMMIT_LOG: ${{ inputs.include_commit_log }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" validate

    # Only for include_last_commit/include_commit_log when the caller has no
    # checkout, and never into the caller's workspace itself (see jules.sh).
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      if: ${{ steps.validate.outputs.needs_checkout == 'true' }}
      with:
        path: ${{ steps.validate.outputs.git_context_dir }}
        fetch-depth: 30
        persist-credentials: false

    - name: Create Jules session
      id: invoke
      if: ${{ steps.validate.outputs.mode == 'create' }}
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        JULES_PROMPT: ${{ inputs.prompt }}
        JULES_TITLE: ${{ inputs.title }}
        JULES_STARTING_BRANCH: ${{ inputs.starting_branch }}
        JULES_REPOSITORY: ${{ github.repository }}
        JULES_REQUIRE_PLAN_APPROVAL: ${{ steps.validate.outputs.require_plan_approval }}
        JULES_AUTOMATION_MODE: ${{ steps.validate.outputs.automation_mode }}
        JULES_INCLUDE_LAST_COMMIT: ${{ steps.validate.outputs.include_last_commit }}
        JULES_INCLUDE_COMMIT_LOG: ${{ steps.validate.outputs.include_commit_log }}
        JULES_GIT_CONTEXT_DIR: ${{ steps.validate.outputs.git_context_dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" create

    - name: Delete Jules session
      id: delete
      if: ${{ steps.validate.outputs.mode == 'delete' }}
      shell: bash
      env:
        JULES_API_KEY: ${{ inputs.jules_api_key }}
        JULES_SESSION_ID: ${{ inputs.session_id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" delete

    - name: Remove the conejo's checkout
      id: cleanup
      if: ${{ always() && steps.validate.outputs.needs_checkout == 'true' }}
      shell: bash
      env:
        JULES_GIT_CONTEXT_DIR: ${{ steps.validate.outputs.git_context_dir }}
      run: bash "$GITHUB_ACTION_PATH/scripts/jules.sh" cleanup
